version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: video_rental_postgres
    environment:
      POSTGRES_DB: video_rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

  web:
    image: python:3.11-alpine
    container_name: video_rental_web
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: python -m http.server 8000
    depends_on:
      - postgres

volumes:
  pgdata: